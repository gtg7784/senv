[package]
name = "senv"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
authors = ["Alan <gtg7784@github>"]
description = "Encrypted .env replacement with first-class TUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gtg7784/senv"
homepage = "https://github.com/gtg7784/senv"
readme = "README.md"
keywords = ["env", "secrets", "encryption", "age", "tui"]
categories = ["command-line-utilities", "cryptography"]

[lib]
name = "senv"
path = "src/lib.rs"

[[bin]]
name = "senv"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }

ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"

secrecy = "0.10"
zeroize = { version = "1", features = ["derive"] }

age = { version = "0.11", features = ["armor"] }
base64 = "0.22"
blake3 = "1"
keyring-core = "1"
constant_time_eq = "0.4"
fs2 = "0.4"
tempfile = "3"

anyhow = "1"
thiserror = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
dotenvy = "0.15"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"



[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
