[package]
name = "senv"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Alan <gtg7784@github>"]
description = "Encrypted .env replacement with first-class TUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gtg7784/senv"
homepage = "https://github.com/gtg7784/senv"
readme = "README.md"
keywords = ["env", "secrets", "encryption", "age", "tui"]
categories = ["command-line-utilities", "cryptography"]

[lib]
name = "senv"
path = "src/lib.rs"

[[bin]]
name = "senv"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }

ratatui = "0.28"
crossterm = "0.28"
tui-textarea = "0.7"

secrecy = "0.10"
zeroize = { version = "1", features = ["derive"] }

anyhow = "1"
thiserror = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
dotenvy = "0.15"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
